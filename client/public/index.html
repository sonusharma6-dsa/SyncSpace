<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="description" content="SyncSpace - Real-time team collaboration" />
    <title>SyncSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --primary: #7C3AED;
        --success: #10B981;
        --danger: #EF4444;
        --border: #E5E7EB;
        --text: #1F2937;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #FFFFFF; color: #1F2937; }
      @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
      .slide-down { animation: slideDown 0.3s ease-out forwards; }
      .slide-up { animation: slideUp 0.3s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .fade-in { animation: fadeIn 0.2s ease-out; }
      .drag-transition { transition: transform 200ms ease, box-shadow 200ms ease; }
      .drag-over { border: 2px dashed #7C3AED; background: #F5F3FF; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
