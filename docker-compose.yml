services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/notemesh
      JWT_SECRET: development_jwt_secret_change_me
      JWT_REFRESH_SECRET: development_refresh_secret_change_me
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      NODE_ENV: production
      DEMO_USER_NAME: Demo User
      DEMO_USER_EMAIL: demo@notemesh.local
      DEMO_USER_PASSWORD: demopass123
      MAX_FILE_SIZE_MB: 10
      UPLOADS_DIR: uploads
    depends_on:
      - mongo
    volumes:
      - note_uploads:/app/uploads

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo_data:
  note_uploads:
